name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env: { ATLAS_PROVIDER: offline }   # no secrets, no network calls, no spend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python scripts/lock_manifest.py --check
      - run: uv run pytest
