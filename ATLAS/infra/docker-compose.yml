# Local production-shaped stack. Postgres (pgvector) for checkpoints/store/audit/metrics, Redis for cache/
# buckets/streams, LocalStack for SQS FIFO, an OTel collector + Jaeger for traces.
# NOTE: the reference code ships local adapters (SQLite / in-memory). Swapping to these services is the P8 lab:
# PostgresSaver/PostgresStore, SQSQueue (atlas/api/queue.py), Redis token buckets (resilience.TOKEN_BUCKET_LUA).
name: atlas
x-app: &app
  build: { context: .., dockerfile: infra/Dockerfile }
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas
    REDIS_URL: redis://redis:6379/0
    QUEUE_URL: http://localstack:4566/000000000000/atlas-tickets.fifo
    AWS_DEFAULT_REGION: eu-central-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_ENDPOINT_URL: http://localstack:4566
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    IT_MCP_URL: http://mcp-it:8001/mcp
  depends_on: [postgres, redis, localstack]

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas, POSTGRES_DB: atlas }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  localstack:
    image: localstack/localstack:4.9
    environment: { SERVICES: sqs }
    ports: ["4566:4566"]
    volumes: ["./localstack-init.sh:/etc/localstack/init/ready.d/init.sh"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel/config.yaml:/etc/otel/config.yaml"]
    ports: ["4317:4317"]
  jaeger:
    image: jaegertracing/all-in-one:1.74.0
    ports: ["16686:16686"]
  mcp-it:
    <<: *app
    command: ["uv", "run", "--no-sync", "python", "-m", "atlas.mcp.it_server"]
    ports: ["8001:8001"]
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: ["uv", "run", "--no-sync", "python", "-m", "atlas.api.worker"]
    deploy: { replicas: 2 }
  online-eval:
    <<: *app
    command: ["uv", "run", "--no-sync", "python", "-m", "atlas.ops.online_eval", "--every", "3600"]

volumes:
  pg: {}
